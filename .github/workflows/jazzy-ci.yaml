name: jazzy-ci

"on":
  push:
    branches: [jazzy]
  pull_request:
    branches: [jazzy]

env:
  # Docker image based on ros:jazzy with libfranka 0.7.0 prebuilt
  # (the libfranka version this port must stay compatible with).
  CI_IMAGE: tstoyanov/jazzy_libfranka:latest
  ROS_DISTRO: jazzy

jobs:
  build-and-test:
    name: Build and test (colcon)
    runs-on: ubuntu-24.04
    container:
      image: tstoyanov/jazzy_libfranka:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions \
            python3-rosdep \
            build-essential \
            cmake \
            ros-jazzy-xacro
          rm -rf /var/lib/apt/lists/*

      - name: Install ROS dependencies (rosdep)
        shell: bash
        run: |
          source /opt/ros/${{ env.ROS_DISTRO }}/setup.bash
          rosdep update || true
          rosdep install --from-paths . --ignore-src -r -y \
            --rosdistro ${{ env.ROS_DISTRO }} || true

      - name: Build workspace
        shell: bash
        run: |
          source /opt/ros/${{ env.ROS_DISTRO }}/setup.bash
          colcon build --cmake-args -DCMAKE_BUILD_TYPE=Release

      - name: Run tests
        shell: bash
        run: |
          source /opt/ros/${{ env.ROS_DISTRO }}/setup.bash
          source install/setup.bash
          echo "--- ldd franka_hw_test ---"
          ldd build/franka_hw/test/franka_hw_test | grep -i franka || true
          echo "--- ldd franka_hw_urdf_test ---"
          ldd build/franka_hw/test/franka_hw_urdf_test | grep -i franka || true
          echo "--- readelf rpath ---"
          readelf -d build/franka_hw/test/franka_hw_test | grep -E "RPATH|RUNPATH|NEEDED" || true
          readelf -d build/franka_hw/test/franka_hw_urdf_test | grep -E "RPATH|RUNPATH|NEEDED" || true
          colcon test --event-handlers console_direct+
          colcon test-result --verbose

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/**/test_results
          if-no-files-found: ignore

  lint:
    name: Lint (ament linters)
    runs-on: ubuntu-24.04
    container:
      image: tstoyanov/jazzy_libfranka:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lint dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions \
            ros-${{ env.ROS_DISTRO }}-ament-lint \
            ros-${{ env.ROS_DISTRO }}-ament-cmake-clang-format \
            ros-${{ env.ROS_DISTRO }}-ament-cmake-cppcheck \
            ros-${{ env.ROS_DISTRO }}-ament-cmake-uncrustify \
            ros-${{ env.ROS_DISTRO }}-ament-cmake-xmllint \
            ros-${{ env.ROS_DISTRO }}-xacro
          rm -rf /var/lib/apt/lists/*

      - name: Build for linters
        shell: bash
        run: |
          source /opt/ros/${{ env.ROS_DISTRO }}/setup.bash
          colcon build --packages-select \
            franka_msgs franka_hw franka_control franka_gripper \
            franka_example_controllers franka_visualization franka_description

      - name: Run linters
        shell: bash
        run: |
          source /opt/ros/${{ env.ROS_DISTRO }}/setup.bash
          colcon test --packages-select \
            franka_msgs franka_hw franka_control franka_gripper \
            franka_example_controllers franka_visualization franka_description \
            --event-handlers console_direct+
          colcon test-result --verbose
